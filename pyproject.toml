[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zprint"
version = "0.1.0"
description = "Z-PRINT Phase 1: payment-gated simulated printing"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "SQLAlchemy==2.0.40",
  "alembic==1.15.2", "psycopg[binary]==3.2.9", "python-multipart==0.0.20",
  "pypdf==5.4.0", "httpx==0.28.1"
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[tool.setuptools.packages.find]
where = ["services/backend-api", "services/print-agent", "services/document-processor", "services/payment-service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services/backend-api", "services/print-agent", "services/document-processor", "services/payment-service"]
